<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHHAYA – Asian drama catalog</title>
<style>
:root{--bg:#070E20;--surface:#111B32;--surface2:#192642;--text:#F8FAFF;--muted:#A8B8D4;--accent:#E52341;--primary:#17489B;--primary-hover:#215AC0;--line:#273958;--r:14px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:90px;scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,rgba(23,72,155,.13),transparent 55%),var(--bg);color:var(--text);font:15px/1.6 "Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #F8FAFF;outline-offset:3px}
.wrap{max-width:1360px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:20;background:rgba(7,14,32,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.16)}
header::after{content:"";position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--primary),var(--accent),var(--primary))}
.bar{display:flex;align-items:center;gap:26px;height:74px}
.logo{font-weight:900;font-size:25px;letter-spacing:-1.1px;white-space:nowrap}
.logo b{color:var(--accent)}
nav{display:flex;align-items:center;gap:5px}
nav button{position:relative;padding:10px 14px;border-radius:9px;color:var(--muted);font-weight:600;font-size:14px;transition:.25s ease}
nav button:hover{color:#fff;background:rgba(23,72,155,.22)}
nav button.on{color:#fff;background:rgba(23,72,155,.38)}
nav button.on::after{content:"";position:absolute;left:25%;right:25%;bottom:0;height:3px;border-radius:4px;background:var(--accent)}
.search{margin-left:auto;position:relative;flex:0 1 340px;width:100%}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.045);color:var(--text);padding:0 16px 0 43px;font:inherit;transition:.25s}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:none;border-color:var(--primary-hover);box-shadow:0 0 0 3px rgba(23,72,155,.25);background:var(--surface)}
.search svg{position:absolute;left:14px;top:13px;width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2;pointer-events:none}
.burger{display:none;width:42px;height:42px;border-radius:10px;background:var(--surface);font-size:22px;border:1px solid var(--line)}
.hero{position:relative;height:min(54vw,540px);min-height:340px;overflow:hidden;border-radius:0 0 22px 22px;background:var(--surface)}
.slide{position:absolute;inset:0;display:flex;align-items:flex-end;opacity:0;transition:opacity .65s ease;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,14,32,.94) 0%,rgba(7,14,32,.72) 38%,rgba(7,14,32,.12) 100%),linear-gradient(0deg,var(--bg),transparent 65%)}
.slide .in{position:relative;z-index:2;padding:0 24px 75px;max-width:1360px;margin:0 auto;width:100%}
.slide h2{margin:0 0 15px;font-size:clamp(32px,5vw,64px);font-weight:850;letter-spacing:-1.8px;line-height:1.1;max-width:750px;text-shadow:0 5px 25px rgba(0,0,0,.35)}
.slide p{margin:0 0 25px;max-width:540px;color:#D9E2F3;font-size:15px;line-height:1.8;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px;color:#D6E0F2;font-size:13px}
.tag{background:rgba(23,72,155,.55);color:#fff;padding:4px 11px;border:1px solid rgba(255,255,255,.12);border-radius:6px;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 23px;border-radius:10px;font-weight:750;transition:background .25s,transform .25s,box-shadow .25s}
.btn.p{background:var(--accent);color:#fff;box-shadow:0 6px 22px rgba(229,35,65,.22)}
.btn.p:hover{background:#F03450;transform:translateY(-2px);box-shadow:0 10px 30px rgba(229,35,65,.35)}
.btn.s{background:rgba(255,255,255,.11);color:#fff;border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(10px)}
.btn.s:hover{background:rgba(23,72,155,.42);transform:translateY(-2px)}
.arrow{position:absolute;top:50%;z-index:3;width:46px;height:46px;border-radius:50%;background:rgba(7,14,32,.6);border:1px solid rgba(255,255,255,.24);font-size:24px;transform:translateY(-50%);transition:.25s}
.arrow:hover{background:var(--primary)}
.arrow.l{left:18px}.arrow.r{right:18px}
.dots{position:absolute;z-index:3;bottom:26px;right:28px;display:flex;gap:8px}
.dots button{width:9px;height:9px;border-radius:8px;background:rgba(255,255,255,.4);transition:.3s}
.dots button.on{width:30px;background:var(--accent)}
.filters{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:36px 0 24px}
.filters h3{margin:0 auto 0 0;font-size:25px;font-weight:800;letter-spacing:-.6px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 17px;border-radius:9px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:650;transition:.25s}
.chip:hover{border-color:var(--primary-hover);color:#fff;background:rgba(23,72,155,.2)}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
select{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:9px;height:39px;padding:0 12px;font:inherit;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:25px 18px;padding-bottom:30px}
.card{position:relative;text-align:left;display:block;width:100%;min-width:0;border-radius:14px;transition:transform .25s}
.card:hover{transform:translateY(-5px)}
.poster{position:relative;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;display:flex;align-items:flex-end;padding:12px;border:1px solid rgba(255,255,255,.08);box-shadow:0 8px 24px rgba(0,0,0,.25);transition:box-shadow .25s,border-color .25s}
.card:hover .poster{border-color:rgba(23,72,155,.65);box-shadow:0 15px 35px rgba(0,0,0,.45)}
.poster::after{content:"";position:absolute;inset:40% 0 0;background:linear-gradient(0deg,rgba(7,14,32,.65),transparent);pointer-events:none}
.poster .ini{position:absolute;top:12px;left:15px;font-size:62px;font-weight:900;opacity:.22;line-height:1}
.badge{position:absolute;z-index:1;top:10px;right:10px;background:rgba(7,14,32,.82);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:3px 9px;font-size:11px;font-weight:750;backdrop-filter:blur(8px)}
.rate{position:absolute;z-index:1;left:10px;bottom:10px;background:rgba(7,14,32,.85);color:#FFD36E;border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:3px 9px;font-size:12px;font-weight:800}
.play{position:absolute;z-index:2;inset:0;background:rgba(7,14,32,.56);display:grid;place-items:center;opacity:0;transition:opacity .25s;font-size:36px;color:#fff}
.card:hover .play,.card:focus-visible .play{opacity:1}
.card .t{margin-top:12px;font-weight:750;font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{color:var(--muted);font-size:12px;margin-top:4px}
.more{display:block;margin:12px auto 48px;padding:12px 34px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-weight:750;transition:.25s}
.more:hover{background:var(--primary);border-color:var(--primary);transform:translateY(-2px)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:70px 0}
footer{border-top:1px solid var(--line);padding:32px 0;color:var(--muted);background:#080F22;font-size:13px;text-align:center}
.modal{position:fixed;inset:0;z-index:50;background:rgba(2,6,16,.86);backdrop-filter:blur(9px);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:36px 14px}
.modal.open{display:flex}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:18px;width:100%;max-width:900px;position:relative;overflow:hidden;box-shadow:0 25px 90px rgba(0,0,0,.5)}
.x{position:absolute;top:14px;right:14px;z-index:5;width:40px;height:40px;border-radius:50%;background:rgba(7,14,32,.8);border:1px solid rgba(255,255,255,.17);font-size:18px}
.x:hover{background:var(--accent)}
.dh{display:flex;align-items:flex-start;gap:28px;padding:32px}
.dh .poster{width:200px;flex:none;aspect-ratio:2/3}
.dh h2{margin:0 0 12px;font-size:30px;font-weight:850;line-height:1.2}
.dh p{color:#CFD9EA;margin:18px 0 24px;line-height:1.8}
.dh .btn{margin:0 8px 8px 0}
.eps{padding:0 32px 32px}
.eps h4{margin:0 0 16px;font-size:18px}
.epg{display:grid;grid-template-columns:repeat(auto-fill,minmax(65px,1fr));gap:10px}
.epg button{padding:11px 0;border-radius:9px;background:var(--surface2);border:1px solid var(--line);font-weight:700;transition:.2s}
.epg button:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.player{aspect-ratio:16/9;background:radial-gradient(ellipse at center,#142D60 0%,#030710 75%);display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted)}
.player strong{display:block;color:var(--text);font-size:21px;margin-bottom:10px}
.pc{display:flex;gap:10px;align-items:center;padding:18px 22px;flex-wrap:wrap}
.pc span{margin-right:auto;font-weight:650}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(100px);background:var(--surface2);color:#fff;padding:13px 23px;border-radius:10px;z-index:60;transition:transform .3s;border:1px solid var(--primary);box-shadow:0 12px 35px rgba(0,0,0,.3)}
.toast.on{transform:translateX(-50%) translateY(0)}
.video-stage{width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
.video-stage video,.video-stage iframe{display:block;width:100%;height:100%;border:0;object-fit:contain}
.source-editor{padding:45px 34px}
.source-editor h2{font-size:clamp(23px,3vw,32px);margin:12px 0}
.source-editor p{color:var(--muted);max-width:620px;line-height:1.7}
.watch-pill{display:inline-block;background:rgba(23,72,155,.3);color:#d7e8ff;border:1px solid #33558a;padding:6px 12px;border-radius:100px;font-size:12px;font-weight:700}
.source-editor label{display:block;margin:25px 0 8px;font-weight:700}
.source-editor input{display:block;width:100%;padding:14px 16px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;font:inherit}
.source-editor input:focus{outline:2px solid var(--primary-hover)}
.source-actions{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.source-note{color:var(--muted);font-size:12px;padding:0 22px 20px}
.rights-strip{display:flex;align-items:center;gap:16px;margin:24px 0 0;padding:17px 20px;background:linear-gradient(95deg,rgba(23,72,155,.33),rgba(17,27,50,.9));border:1px solid #34486f;border-left:3px solid #E52341;border-radius:12px}
.rights-strip strong{white-space:nowrap}
.rights-strip span{flex:1;color:#c9d6eb;font-size:13px}
.rights-strip button{background:#17489b;padding:9px 13px;border-radius:8px;font-weight:750}
@media(max-width:820px){
.burger{display:block;flex:none}
.bar{gap:12px;height:66px}
nav{position:absolute;top:66px;left:0;right:0;background:#0B1630;flex-direction:column;align-items:stretch;padding:14px 20px;display:none;border-bottom:1px solid var(--line);box-shadow:0 20px 40px rgba(0,0,0,.4)}
nav.open{display:flex}
nav button{text-align:left;padding:12px 16px}
nav button.on::after{left:0;right:auto;top:25%;bottom:25%;width:3px;height:auto}
.search{flex:1;min-width:0}
.arrow{display:none}
.grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:20px 12px}
.dh{flex-direction:column;align-items:center;text-align:center;padding:50px 20px 22px}
.dh .poster{width:165px}
.dh .meta{justify-content:center}
.eps{padding:0 20px 24px}}
@media(max-width:650px){.rights-strip{align-items:flex-start;flex-direction:column;gap:10px}}
@media(max-width:600px){
.wrap{padding:0 14px}
.bar{gap:9px}
.logo{font-size:19px;letter-spacing:-.7px}
.search input{height:38px;font-size:13px;padding-left:34px}
.search svg{left:10px;top:10px;width:16px;height:16px}
.hero{height:390px;min-height:0;border-radius:0 0 16px 16px}
.slide::after{background:linear-gradient(0deg,var(--bg) 0%,rgba(7,14,32,.88) 28%,rgba(7,14,32,.28) 100%)}
.slide .in{padding:0 18px 45px}
.slide h2{font-size:32px;letter-spacing:-1px}
.slide p{font-size:13px;-webkit-line-clamp:2;margin-bottom:16px}
.btn{padding:10px 14px;font-size:13px}
.dots{right:16px;bottom:15px}
.filters{padding:25px 0 17px;gap:12px}
.filters h3{font-size:20px;width:100%}
.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 10px}
.poster{border-radius:10px}
.card .t{font-size:12px}.card .m{font-size:11px}
.badge{font-size:10px;padding:2px 5px}
.rate{font-size:10px;padding:2px 6px}
.modal{padding:12px 8px}
.sheet{border-radius:14px}
.dh h2{font-size:24px}
.pc{padding:14px}.pc span{width:100%}
.source-editor{padding:55px 18px 25px}}
@media(hover:none){.play{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="wrap bar">
<a class="logo" href="#" id="logo">Night<b>reel</b></a>
<nav id="nav" aria-label="Main"></nav>
<div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="Search titles" aria-label="Search titles"></div>
<button class="burger" id="burger" aria-label="Menu">☰</button>
</div></header>
<main>
<section class="hero" id="hero" aria-label="Featured"></section>
<div class="wrap"><div class="rights-strip"><strong>▶ Playable open films</strong><span>Watch complete, legally shared films with credits. Other catalog titles are information-only until you add licensed videos.</span><button data-n="Playable">Browse playable →</button></div></div>
<div class="wrap">
<div class="filters"><h3 id="ttl">Latest updates</h3>
<select id="sort" aria-label="Sort"><option value="new">Newest</option><option value="rate">Top rated</option><option value="az">A–Z</option></select>
<div class="chips" id="chips"></div></div>
<div class="grid" id="grid"></div>
<button class="more" id="more">Load more</button>
</div>
</main>
<footer><div class="wrap">Nightreel — Discover films and stream titles you are authorized to watch. Movie data from TMDB; not endorsed by TMDB.</div></footer>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
const API_KEY = "976a28e22b2840518b7045613a7d7dbc";
const BASE = "https://api.themoviedb.org/3";
const IMG = "https://image.tmdb.org/t/p/w500";
const BG_IMG = "https://image.tmdb.org/t/p/w1280";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hues = [12, 28, 200, 260, 330, 150, 45, 185, 300, 100];
const bg = h => `linear-gradient(160deg,hsl(${h} 55% 38%),hsl(${(h+50)%360} 50% 16%))`;
const posterStyle = i => i.poster ? `background:url('${i.poster}') center/cover no-repeat` : `background:${bg(i.h)}`;
const slideStyle = i => i.backdrop ? `background:linear-gradient(to right, rgba(10,12,18,.92) 30%, rgba(10,12,18,.35)), url('${i.backdrop}') center/cover no-repeat` : `background:${bg(i.h)}`;

let items = [];
let nav = "Home", country = "All", sort = "new", term = "", shown = 12, slide = 0, timer;
let saved = [];
try { saved = JSON.parse(localStorage.getItem("nr-saved") || "[]"); } catch (e) {}
let sources = {};
try { sources = JSON.parse(localStorage.getItem("nr-src") || "{}"); } catch (e) {}
const saveSources = () => { try { localStorage.setItem("nr-src", JSON.stringify(sources)); } catch (_) {} };

const OPEN_FILMS = [
  { title:"Big Buck Bunny", year:2008, rate:7.1, desc:"Blender Foundation open movie. Licensed CC BY 3.0 © Blender Foundation | peach.blender.org",
    src:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" },
  { title:"Sintel", year:2010, rate:7.5, desc:"Blender Foundation open movie. Licensed CC BY 3.0 © Blender Foundation | durian.blender.org",
    src:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4" },
  { title:"Tears of Steel", year:2012, rate:6.9, desc:"Blender Foundation open movie. Licensed CC BY 3.0 © Blender Foundation | mango.blender.org",
    src:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" }
];

const srcFor = i => i.src || sources[i.tmdbId] || "";

function playerHTML(src, title) {
  if (!/^https:\/\//i.test(src)) return "";
  const yt = src.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);
  if (yt) return `<div class="video-stage"><iframe src="https://www.youtube.com/embed/${yt[1]}?autoplay=1" title="${esc(title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`;
  return `<div class="video-stage"><video controls autoplay playsinline src="${esc(src)}"></video></div>`;
}

const navs = ["Home", "Drama", "Movies", "Anime", "Variety", "Playable", "My list"];
$("#nav").innerHTML = navs.map(n => `<button data-n="${n}">${n}</button>`).join("");

const countries = ["All", "Korea", "China", "Japan", "Thailand", "Open"];
$("#chips").innerHTML = countries.map(c => `<button class="chip" data-c="${c}">${c}</button>`).join("");

const typeMap = { Drama: "Drama", Movies: "Movie", Anime: "Anime", Variety: "Variety" };
const langMap = { ko: "Korea", zh: "China", ja: "Japan", th: "Thailand" };

function toast(m) {
  const t = $("#toast");
  t.textContent = m;
  t.classList.add("on");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove("on"), 2200);
}

async function loadTMDB() {
  $("#grid").innerHTML = `<div class="empty">Loading international titles from TMDB...</div>`;
  const fetched = [];
  let idx = 0;
  try {
    const langs = ["ko", "zh", "ja", "th"];
    const requests = [
      ...langs.map(l => fetch(`${BASE}/discover/tv?api_key=${API_KEY}&with_original_language=${l}&sort_by=popularity.desc`).then(r => r.json()).then(d => ({ media: "tv", lang: l, results: d.results || [] }))),
      ...langs.map(l => fetch(`${BASE}/discover/movie?api_key=${API_KEY}&with_original_language=${l}&sort_by=popularity.desc`).then(r => r.json()).then(d => ({ media: "movie", lang: l, results: d.results || [] })))
    ];
    const responses = await Promise.all(requests);

    responses.forEach(group => {
      group.results.slice(0, 8).forEach(raw => {
        const isMovie = group.media === "movie";
        const genres = raw.genre_ids || [];
        let type = isMovie ? "Movie" : "Drama";
        if (genres.includes(16)) type = "Anime";
        else if (!isMovie && (genres.includes(10764) || genres.includes(10767))) type = "Variety";
        const dateStr = isMovie ? raw.release_date : raw.first_air_date;
        const year = dateStr ? parseInt(dateStr.split("-")[0], 10) : 2026;
        fetched.push({
          id: idx, tmdbId: raw.id, media: group.media,
          title: isMovie ? raw.title : raw.name,
          country: langMap[group.lang] || "Korea", type,
          eps: isMovie ? 1 : Math.max(8, (raw.id % 24) + 8),
          rate: raw.vote_average ? Number(raw.vote_average.toFixed(1)) : 8.0,
          year: year || 2026,
          desc: raw.overview || "No description available yet.",
          poster: raw.poster_path ? `${IMG}${raw.poster_path}` : "",
          backdrop: raw.backdrop_path ? `${BG_IMG}${raw.backdrop_path}` : "",
          h: hues[idx % hues.length]
        });
        idx++;
      });
    });
  } catch (err) {
    console.error(err);
    toast("Could not load TMDB titles. Showing open films only.");
  }

  OPEN_FILMS.forEach((f, k) => fetched.push({
    ...f, id: idx + k, tmdbId: "open-" + k, media: "open", country: "Open", type: "Movie",
    eps: 1, poster: "", backdrop: "", h: hues[(idx + k) % hues.length]
  }));

  items = fetched;
  heroBuild();
  render();
  auto();
}

function list() {
  let r = items.filter(i => (country === "All" || i.country === country) && i.title.toLowerCase().includes(term.toLowerCase()));
  if (typeMap[nav]) r = r.filter(i => i.type === typeMap[nav]);
  if (nav === "My list") r = r.filter(i => saved.includes(i.tmdbId));
  if (nav === "Playable") r = r.filter(i => srcFor(i));
  if (sort === "new") r.sort((a, b) => b.year - a.year || a.id - b.id);
  if (sort === "rate") r.sort((a, b) => b.rate - a.rate);
  if (sort === "az") r.sort((a, b) => a.title.localeCompare(b.title));
  return r;
}

function render() {
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.n === nav));
  document.querySelectorAll(".chip").forEach(b => b.classList.toggle("on", b.dataset.c === country));
  $("#ttl").textContent = term ? `Results for “${term}”` : nav === "Home" ? "Latest updates" : nav;
  const r = list();
  const emptyMsg = nav === "My list" ? "Your list is empty. Open a title and tap Add to list."
    : nav === "Playable" ? "No playable titles yet. Open a title and add a licensed video."
    : "No titles match. Try another search or filter.";
  $("#grid").innerHTML = r.length ? r.slice(0, shown).map(i => `
    <button class="card" data-id="${i.id}">
      <div class="poster" style="${posterStyle(i)}">
        ${i.poster ? "" : `<span class="ini">${esc(i.title[0])}</span>`}
        <span class="badge">${i.type === "Movie" ? "Movie" : "EP " + i.eps}</span>
        <span class="rate">★ ${i.rate}</span>
        <span class="play">▶</span>
      </div>
      <div class="t">${esc(i.title)}</div>
      <div class="m">${esc(i.country)} · ${i.year}</div>
    </button>
  `).join("") : `<div class="empty">${emptyMsg}</div>`;
  $("#more").style.display = r.length > shown ? "block" : "none";
}

function heroBuild() {
  const f = [...items].filter(x => x.backdrop).sort((a, b) => b.rate - a.rate).slice(0, 5);
  if (!f.length) return;
  $("#hero").innerHTML = f.map((i, k) => `
    <div class="slide${k === 0 ? " on" : ""}" style="${slideStyle(i)}">
      <div class="in">
        <div class="meta">
          <span class="tag">${i.type}</span>
          <span>${esc(i.country)}</span>
          <span>${i.year}</span>
          <span>★ ${i.rate}</span>
        </div>
        <h2>${esc(i.title)}</h2>
        <p>${esc(i.desc)}</p>
        <button class="btn p" data-watch="${i.id}">${srcFor(i) ? "▶ Watch full film" : "▶ Watch Trailer"}</button>
        <button class="btn s" data-id="${i.id}">Details</button>
      </div>
    </div>
  `).join("") + `
    <button class="arrow l" data-d="-1" aria-label="Previous">‹</button>
    <button class="arrow r" data-d="1" aria-label="Next">›</button>
    <div class="dots">${f.map((_, k) => `<button data-k="${k}" aria-label="Slide ${k + 1}" class="${k === 0 ? "on" : ""}"></button>`).join("")}</div>
  `;
}

function go(k) {
  const s = document.querySelectorAll(".slide"), d = document.querySelectorAll(".dots button");
  if (!s.length) return;
  slide = (k + s.length) % s.length;
  s.forEach((e, j) => e.classList.toggle("on", j === slide));
  d.forEach((e, j) => e.classList.toggle("on", j === slide));
}

function auto() {
  clearInterval(timer);
  if (!matchMedia("(prefers-reduced-motion:reduce)").matches) timer = setInterval(() => go(slide + 1), 6000);
}

function detail(id) {
  const i = items[id];
  if (!i) return;
  const on = saved.includes(i.tmdbId);
  $("#sheet").innerHTML = `
    <button class="x" data-close aria-label="Close">✕</button>
    <div class="dh">
      <div class="poster" style="${posterStyle(i)}">
        ${i.poster ? "" : `<span class="ini">${esc(i.title[0])}</span>`}
      </div>
      <div>
        <h2>${esc(i.title)}</h2>
        <div class="meta">
          <span class="tag">${i.type}</span>
          <span>${esc(i.country)}</span>
          <span>${i.year}</span>
          <span>${i.eps} ${i.eps > 1 ? "episodes" : "episode"}</span>
          <span>★ ${i.rate}</span>
        </div>
        <p>${esc(i.desc)}</p>
        <button class="btn p" data-watch="${id}">${srcFor(i) ? "▶ Watch full film" : "▶ Watch Trailer"}</button>
        <button class="btn s" data-save="${id}">${on ? "✓ In your list" : "+ Add to list"}</button>
        ${i.media !== "open" ? `<button class="btn s" data-src="${id}">${srcFor(i) ? "Change video" : "+ Add licensed video"}</button>` : ""}
      </div>
    </div>
    ${i.eps > 1 ? `<div class="eps"><h4>Episodes</h4><div class="epg">${Array.from({ length: i.eps }, (_, k) => `<button data-watch="${id}" data-ep="${k + 1}">${k + 1}</button>`).join("")}</div></div>` : ""}
  `;
  open_();
}

async function watch(id, ep = 1) {
  const i = items[id];
  if (!i) return;
  const src = srcFor(i);
  if (src) {
    $("#sheet").innerHTML = `
      <button class="x" data-close aria-label="Close">✕</button>
      ${playerHTML(src, i.title)}
      <div class="pc"><span>${esc(i.title)}</span>
        ${i.media !== "open" ? `<button class="btn s" data-src="${id}">Change source</button>` : ""}
        <button class="btn s" data-id="${id}">Details</button></div>
      <div class="source-note">${i.src ? esc(i.desc) : "Video supplied by the site owner, who confirms they hold the rights to show it."}</div>`;
    open_();
    return;
  }

  $("#sheet").innerHTML = `
    <button class="x" data-close aria-label="Close">✕</button>
    <div class="player"><div><strong>Loading official trailer...</strong></div></div>`;
  open_();

  let ytKey = null;
  try {
    const res = await fetch(`${BASE}/${i.media}/${i.tmdbId}/videos?api_key=${API_KEY}`);
    const data = await res.json();
    const vid = (data.results || []).find(v => v.site === "YouTube" && (v.type === "Trailer" || v.type === "Teaser")) || (data.results || []).find(v => v.site === "YouTube");
    if (vid) ytKey = vid.key;
  } catch (e) {}

  $("#sheet").innerHTML = `
    <button class="x" data-close aria-label="Close">✕</button>
    <div class="player" style="padding:0;overflow:hidden">
      ${ytKey
        ? `<iframe width="100%" height="100%" style="border:0;aspect-ratio:16/9" src="https://www.youtube.com/embed/${esc(ytKey)}?autoplay=1" title="Trailer" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`
        : `<div style="padding:24px"><strong>${esc(i.title)}</strong>Official YouTube trailer is unavailable for this title.</div>`}
    </div>
    <div class="pc">
      <span>${esc(i.title)} · Trailer</span>
      <button class="btn s" data-src="${id}">+ Add licensed video</button>
      <button class="btn s" data-id="${id}">Details</button>
    </div>`;
}

function sourceEditor(id) {
  const i = items[id];
  if (!i) return;
  $("#sheet").innerHTML = `
    <button class="x" data-close aria-label="Close">✕</button>
    <div class="source-editor">
      <span class="watch-pill">Licensed video</span>
      <h2>${esc(i.title)}</h2>
      <p>Paste an https link to an MP4 or YouTube video you own or are licensed to stream.</p>
      <label for="srcin">Video URL</label>
      <input id="srcin" placeholder="https://..." value="${esc(sources[i.tmdbId] || "")}">
      <div class="source-actions">
        <button class="btn p" data-savesrc="${id}">Save &amp; play</button>
        <button class="btn s" data-clearsrc="${id}">Remove</button>
      </div>
    </div>`;
  open_();
}

function open_() { $("#modal").classList.add("open"); document.body.style.overflow = "hidden"; $("#modal").scrollTop = 0; }
function close_() { $("#modal").classList.remove("open"); document.body.style.overflow = ""; $("#sheet").innerHTML = ""; }

document.addEventListener("click", e => {
  const t = e.target.closest("button,a");
  if (e.target.id === "modal") { close_(); return; }
  if (!t) return;
  const d = t.dataset;
  if (t.id === "logo") { e.preventDefault(); nav = "Home"; country = "All"; term = ""; $("#q").value = ""; shown = 12; render(); }
  else if (d.n) { nav = d.n; shown = 12; render(); $("#nav").classList.remove("open"); window.scrollTo({ top: 0 }); }
  else if (d.c) { country = d.c; shown = 12; render(); }
  else if (d.src !== undefined) { sourceEditor(+d.src); }
  else if (d.savesrc !== undefined) {
    const v = $("#srcin").value.trim();
    if (!/^https:\/\//i.test(v)) { toast("Link must start with https://"); return; }
    sources[items[+d.savesrc].tmdbId] = v;
    saveSources(); render(); watch(+d.savesrc);
  }
  else if (d.clearsrc !== undefined) {
    delete sources[items[+d.clearsrc].tmdbId];
    saveSources(); render(); detail(+d.clearsrc);
  }
  else if (d.watch !== undefined) { watch(+d.watch, +(d.ep || 1)); }
  else if (d.id !== undefined) { detail(+d.id); }
  else if (d.save !== undefined) {
    const item = items[+d.save];
    if (!item) return;
    const tid = item.tmdbId;
    saved = saved.includes(tid) ? saved.filter(x => x !== tid) : [...saved, tid];
    try { localStorage.setItem("nr-saved", JSON.stringify(saved)); } catch (_) {}
    toast(saved.includes(tid) ? "Added to your list" : "Removed from your list");
    detail(+d.save);
    render();
  }
  else if (d.close !== undefined) close_();
  else if (d.d) { go(slide + +d.d); auto(); }
  else if (d.k) { go(+d.k); auto(); }
  else if (t.id === "more") { shown += 8; render(); }
  else if (t.id === "burger") $("#nav").classList.toggle("open");
});

$("#q").addEventListener("input", e => { term = e.target.value.trim(); shown = 12; render(); });
$("#sort").addEventListener("change", e => { sort = e.target.value; render(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") close_(); });

loadTMDB();
</script>
</body>
</html>
