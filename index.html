<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHHAYA – Asian drama catalog</title>
<style>
:root{--bg:#14161c;--surface:#1d2029;--surface2:#262a36;--text:#eceef3;--muted:#9aa1b3;--accent:#ff8a3d;--accent-ink:#1a0e05;--line:#2f3443;--r:10px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#14161c}}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",Roboto,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;background:rgba(20,22,28,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;height:60px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px}.logo b{color:var(--accent)}
nav{display:flex;gap:4px}
nav button{padding:8px 12px;border-radius:8px;color:var(--muted);font-weight:600}
nav button:hover{color:var(--text);background:var(--surface)}
nav button.on{color:var(--accent)}
.search{margin-left:auto;position:relative;flex:0 1 320px;width:100%}
.search input{width:100%;height:38px;border-radius:19px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:0 14px 0 38px;font:inherit}
.search svg{position:absolute;left:12px;top:10px;width:18px;height:18px;fill:none;stroke:var(--muted);stroke-width:2}
.burger{display:none;width:38px;height:38px;border-radius:8px;background:var(--surface);font-size:20px}
.hero{position:relative;height:min(52vw,460px);min-height:280px;overflow:hidden;border-radius:0 0 var(--r) var(--r)}
.slide{position:absolute;inset:0;display:flex;align-items:flex-end;opacity:0;transition:opacity .5s;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 0,rgba(20,22,28,.55) 45%,rgba(20,22,28,.15))}
.slide .in{position:relative;z-index:2;padding:0 16px 56px;max-width:1320px;margin:0 auto;width:100%}
.slide h2{margin:0 0 6px;font-size:clamp(24px,4.5vw,44px);line-height:1.1}
.slide p{margin:0 0 14px;max-width:560px;color:#d3d7e2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;color:var(--muted);font-size:13px}
.tag{background:rgba(255,255,255,.1);padding:2px 8px;border-radius:5px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;font-weight:700}
.btn.p{background:var(--accent);color:var(--accent-ink)}.btn.s{background:rgba(255,255,255,.14)}
.btn:hover{filter:brightness(1.1)}
.arrow{position:absolute;top:50%;z-index:3;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);font-size:20px;transform:translateY(-50%)}
.arrow.l{left:10px}.arrow.r{right:10px}
.dots{position:absolute;z-index:3;bottom:18px;right:16px;display:flex;gap:6px}
.dots button{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.4)}
.dots button.on{width:22px;background:var(--accent)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:22px 0 12px}
.filters h3{margin:0 auto 0 0;font-size:20px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.chip{flex:none;padding:6px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:600}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
select{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;height:34px;padding:0 8px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;padding-bottom:20px}
.card{position:relative;text-align:left;display:block;width:100%}
.poster{position:relative;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;display:flex;align-items:flex-end;padding:10px;transition:transform .2s}
.card:hover .poster{transform:translateY(-4px)}
.poster .ini{position:absolute;top:8px;left:12px;font-size:56px;font-weight:800;opacity:.22;line-height:1}
.badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.65);border-radius:5px;padding:1px 7px;font-size:12px;font-weight:700}
.rate{position:absolute;left:8px;bottom:8px;background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:0 6px;font-size:12px;font-weight:800}
.play{position:absolute;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;opacity:0;transition:opacity .2s;font-size:34px}
.card:hover .play,.card:focus-visible .play{opacity:1}
.card .t{margin-top:8px;font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{color:var(--muted);font-size:12px}
.more{display:block;margin:6px auto 30px;padding:10px 28px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-weight:700}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 0}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:13px;text-align:center}
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.75);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:24px 12px}
.modal.open{display:flex}
.sheet{background:var(--surface);border-radius:14px;width:100%;max-width:860px;position:relative;overflow:hidden}
.x{position:absolute;top:10px;right:10px;z-index:5;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);font-size:18px}
.dh{display:flex;gap:20px;padding:24px}
.dh .poster{width:180px;flex:none;aspect-ratio:2/3}
.dh h2{margin:0 0 6px;font-size:26px}
.dh p{color:#c7ccd9;margin:10px 0 16px}
.eps{padding:0 24px 24px}
.eps h4{margin:0 0 10px}
.epg{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.epg button{padding:8px 0;border-radius:7px;background:var(--surface2);font-weight:600}
.epg button:hover,.epg button.seen{background:var(--accent);color:var(--accent-ink)}
.player{aspect-ratio:16/9;background:#000;display:grid;place-items:center;text-align:center;padding:20px;color:var(--muted)}
.player strong{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
.pc{display:flex;gap:10px;align-items:center;padding:14px 20px;flex-wrap:wrap}
.pc span{margin-right:auto;font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--surface2);padding:10px 18px;border-radius:8px;z-index:60;transition:transform .25s;border:1px solid var(--line)}
.toast.on{transform:translateX(-50%) translateY(0)}
@media (max-width:820px){
.burger{display:block}
nav{position:absolute;top:60px;left:0;right:0;background:var(--surface);flex-direction:column;padding:8px 16px;display:none;border-bottom:1px solid var(--line)}
nav.open{display:flex}
.search{flex:1}
.bar{gap:10px}
.arrow{display:none}
.grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px}
.dh{flex-direction:column;align-items:center;text-align:center;padding:48px 16px 16px}
.dh .poster{width:140px}.dh .meta{justify-content:center}
.eps{padding:0 16px 20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap bar">
<a class="logo" href="#" id="logo">Night<b>reel</b></a>
<nav id="nav" aria-label="Main"></nav>
<div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" type="search" placeholder="Search titles" aria-label="Search titles"></div>
<button class="burger" id="burger" aria-label="Menu">☰</button>
</div></header>

<main>
<section class="hero" id="hero" aria-label="Featured"></section>
<div class="wrap">
<div class="filters"><h3 id="ttl">Latest updates</h3>
<select id="sort" aria-label="Sort"><option value="new">Newest</option><option value="rate">Top rated</option><option value="az">A–Z</option></select>
<div class="chips" id="chips"></div></div>
<div class="grid" id="grid"></div>
<button class="more" id="more">Load more</button>
</div>
</main>
<footer><div class="wrap">CHHAYA is a design demo with fictional titles. No video is hosted or streamed.</div></footer>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const API_KEY = "976a28e22b2840518b7045613a7d7dbc";
  const BASE = "https://api.themoviedb.org/3";
  const IMG = "https://image.tmdb.org/t/p/w500";
  const BG_IMG = "https://image.tmdb.org/t/p/w1280";

  const $ = s => document.querySelector(s);
  const hues = [12, 28, 200, 260, 330, 150, 45, 185, 300, 100];
  const bg = h => `linear-gradient(160deg,hsl(${h} 55% 38%),hsl(${(h+50)%360} 50% 16%))`;
  const posterStyle = i => i.poster ? `background:url('${i.poster}') center/cover no-repeat` : `background:${bg(i.h)}`;
  const slideStyle = i => i.backdrop ? `background:linear-gradient(to right, rgba(10,12,18,.92) 30%, rgba(10,12,18,.35)), url('${i.backdrop}') center/cover no-repeat` : `background:${bg(i.h)}`;

  let items = [];
  let nav = "Home", country = "All", sort = "new", term = "", shown = 12, slide = 0, timer;
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem("nr-saved") || "[]"); } catch (e) {}

  const navs = ["Home", "Drama", "Movies", "Anime", "Variety", "My list"];
  const navEl = $("#nav");
  if (navEl) navEl.innerHTML = navs.map(n => `<button data-n="${n}">${n}</button>`).join("");

  const countries = ["All", "Korea", "China", "Japan", "Thailand"];
  const chipsEl = $("#chips");
  if (chipsEl) chipsEl.innerHTML = countries.map(c => `<button class="chip" data-c="${c}">${c}</button>`).join("");

  const typeMap = { Drama: "Drama", Movies: "Movie", Anime: "Anime", Variety: "Variety" };
  const langMap = { ko: "Korea", zh: "China", ja: "Japan", th: "Thailand" };

  function toast(m) {
    const t = $("#toast");
    if (!t) return;
    t.textContent = m;
    t.classList.add("on");
    clearTimeout(toast.t);
    toast.t = setTimeout(() => t.classList.remove("on"), 2200);
  }

  const fallbackItems = [
    { id: 0, tmdbId: 9991, media: "tv", title: "Midnight Cafe", country: "Korea", type: "Drama", eps: 16, rate: 8.6, year: 2026, desc: "A night-shift barista starts decoding the regulars’ secrets, one order at a time.", poster: "", backdrop: "", h: 12 },
    { id: 1, tmdbId: 9992, media: "tv", title: "The Lantern Keeper", country: "China", type: "Drama", eps: 32, rate: 8.9, year: 2026, desc: "A young archivist inherits a lighthouse that records every promise made to the sea.", poster: "", backdrop: "", h: 28 },
    { id: 2, tmdbId: 9993, media: "tv", title: "Paper Moons", country: "Japan", type: "Anime", eps: 12, rate: 8.2, year: 2026, desc: "Two rival origami artists fold their way into a city-wide mystery.", poster: "", backdrop: "", h: 200 },
    { id: 3, tmdbId: 9994, media: "tv", title: "Seoul by Dawn", country: "Korea", type: "Drama", eps: 12, rate: 7.9, year: 2025, desc: "Three strangers share one train line and a single unsent letter.", poster: "", backdrop: "", h: 260 },
    { id: 4, tmdbId: 9995, media: "tv", title: "Harbor Lights", country: "Thailand", type: "Drama", eps: 14, rate: 8.1, year: 2026, desc: "A returning ferry captain faces the town that remembers his departure.", poster: "", backdrop: "", h: 330 },
    { id: 5, tmdbId: 9996, media: "tv", title: "Jade Ledger", country: "China", type: "Drama", eps: 40, rate: 9.0, year: 2025, desc: "An accountant to the imperial court finds a second set of books.", poster: "", backdrop: "", h: 150 }
  ];

  async function loadTMDB() {
    const gridEl = $("#grid");
    if (gridEl) gridEl.innerHTML = `<div class="empty">Loading international titles from TMDB...</div>`;
    try {
      const langs = ["ko", "zh", "ja", "th"];
      const requests = [
        ...langs.map(l => fetch(`${BASE}/discover/tv?api_key=${API_KEY}&with_original_language=${l}&sort_by=popularity.desc`).then(r => r.json()).then(d => ({ media: "tv", lang: l, results: d.results || [] }))),
        ...langs.map(l => fetch(`${BASE}/discover/movie?api_key=${API_KEY}&with_original_language=${l}&sort_by=popularity.desc`).then(r => r.json()).then(d => ({ media: "movie", lang: l, results: d.results || [] })))
      ];

      const responses = await Promise.all(requests);
      let idx = 0;
      const fetched = [];

      responses.forEach(group => {
        (group.results || []).slice(0, 8).forEach(raw => {
          const isMovie = group.media === "movie";
          const genres = raw.genre_ids || [];
          let type = isMovie ? "Movie" : "Drama";
          if (genres.includes(16)) type = "Anime";
          else if (!isMovie && (genres.includes(10764) || genres.includes(10767))) type = "Variety";

          const dateStr = isMovie ? raw.release_date : raw.first_air_date;
          const year = dateStr ? parseInt(dateStr.split("-")[0], 10) : 2026;

          fetched.push({
            id: idx,
            tmdbId: raw.id,
            media: group.media,
            title: isMovie ? raw.title : raw.name,
            country: langMap[group.lang] || "Korea",
            type: type,
            eps: isMovie ? 1 : Math.max(8, (raw.id % 24) + 8),
            rate: raw.vote_average ? Number(raw.vote_average.toFixed(1)) : 8.0,
            year: year || 2026,
            desc: raw.overview || "No description available yet.",
            poster: raw.poster_path ? `${IMG}${raw.poster_path}` : "",
            backdrop: raw.backdrop_path ? `${BG_IMG}${raw.backdrop_path}` : "",
            h: hues[idx % hues.length]
          });
          idx++;
        });
      });

      items = fetched.length > 0 ? fetched : fallbackItems;
      heroBuild();
      render();
      auto();
    } catch (err) {
      console.error("TMDB load error:", err);
      items = fallbackItems;
      heroBuild();
      render();
      auto();
    }
  }

  function list() {
    let r = items.filter(i => (country === "All" || i.country === country) && i.title.toLowerCase().includes(term.toLowerCase()));
    if (typeMap[nav]) r = r.filter(i => i.type === typeMap[nav]);
    if (nav === "My list") r = r.filter(i => saved.includes(i.tmdbId));
    if (sort === "new") r.sort((a, b) => b.year - a.year || a.id - b.id);
    if (sort === "rate") r.sort((a, b) => b.rate - a.rate);
    if (sort === "az") r.sort((a, b) => a.title.localeCompare(b.title));
    return r;
  }

  function render() {
    document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.n === nav));
    document.querySelectorAll(".chip").forEach(b => b.classList.toggle("on", b.dataset.c === country));
    const ttlEl = $("#ttl");
    if (ttlEl) ttlEl.textContent = term ? `Results for “${term}”` : nav === "Home" ? "Latest updates" : nav;
    const r = list();
    const gridEl = $("#grid");
    if (gridEl) {
      gridEl.innerHTML = r.length ? r.slice(0, shown).map(i => `
        <button class="card" data-id="${i.id}">
          <div class="poster" style="${posterStyle(i)}">
            ${i.poster ? "" : `<span class="ini">${i.title[0]}</span>`}
            <span class="badge">${i.type === "Movie" ? "Movie" : "EP " + i.eps}</span>
            <span class="rate">★ ${i.rate}</span>
            <span class="play">▶</span>
          </div>
          <div class="t">${i.title}</div>
          <div class="m">${i.country} · ${i.year}</div>
        </button>
      `).join("") : `<div class="empty">${nav === "My list" ? "Your list is empty. Open a title and tap Add to list." : "No titles match. Try another search or filter."}</div>`;
    }
    const moreEl = $("#more");
    if (moreEl) moreEl.style.display = r.length > shown ? "block" : "none";
  }

  function heroBuild() {
    const heroEl = $("#hero");
    if (!heroEl) return;
    const backdrops = items.filter(x => x.backdrop);
    const f = backdrops.length ? backdrops.sort((a, b) => b.rate - a.rate).slice(0, 5) : items.slice(0, 5);
    if (!f.length) return;
    heroEl.innerHTML = f.map((i, k) => `
      <div class="slide${k === 0 ? " on" : ""}" style="${slideStyle(i)}">
        <div class="in">
          <div class="meta">
            <span class="tag">${i.type}</span>
            <span>${i.country}</span>
            <span>${i.year}</span>
            <span>★ ${i.rate}</span>
          </div>
          <h2>${i.title}</h2>
          <p>${i.desc}</p>
          <button class="btn p" data-watch="${i.id}">▶ Watch Trailer</button>
          <button class="btn s" data-id="${i.id}">Details</button>
        </div>
      </div>
    `).join("") + `
      <button class="arrow l" data-d="-1" aria-label="Previous">‹</button>
      <button class="arrow r" data-d="1" aria-label="Next">›</button>
      <div class="dots">${f.map((_, k) => `<button data-k="${k}" aria-label="Slide ${k + 1}" class="${k === 0 ? "on" : ""}"></button>`).join("")}</div>
    `;
  }

  function go(k) {
    const s = document.querySelectorAll(".slide"), d = document.querySelectorAll(".dots button");
    if (!s.length) return;
    slide = (k + s.length) % s.length;
    s.forEach((e, j) => e.classList.toggle("on", j === slide));
    d.forEach((e, j) => e.classList.toggle("on", j === slide));
  }

  function auto() {
    clearInterval(timer);
    if (!matchMedia("(prefers-reduced-motion:reduce)").matches) timer = setInterval(() => go(slide + 1), 6000);
  }

  function detail(id) {
    const i = items[id];
    if (!i) return;
    const on = saved.includes(i.tmdbId);
    const sheetEl = $("#sheet");
    if (sheetEl) {
      sheetEl.innerHTML = `
        <button class="x" data-close aria-label="Close">✕</button>
        <div class="dh">
          <div class="poster" style="${posterStyle(i)}">
            ${i.poster ? "" : `<span class="ini">${i.title[0]}</span>`}
          </div>
          <div>
            <h2>${i.title}</h2>
            <div class="meta">
              <span class="tag">${i.type}</span>
              <span>${i.country}</span>
              <span>${i.year}</span>
              <span>${i.eps} ${i.eps > 1 ? "episodes" : "episode"}</span>
              <span>★ ${i.rate}</span>
            </div>
            <p>${i.desc}</p>
            <button class="btn p" data-watch="${id}">▶ Watch Trailer</button>
            <button class="btn s" data-save="${id}">${on ? "✓ In your list" : "+ Add to list"}</button>
          </div>
        </div>
        ${i.eps > 1 ? `<div class="eps"><h4>Episodes</h4><div class="epg">${Array.from({ length: i.eps }, (_, k) => `<button data-watch="${id}" data-ep="${k + 1}">${k + 1}</button>`).join("")}</div></div>` : ""}
      `;
    }
    open_();
  }

  async function watch(id, ep = 1) {
    const i = items[id];
    if (!i) return;
    const sheetEl = $("#sheet");
    if (sheetEl) {
      sheetEl.innerHTML = `
        <button class="x" data-close aria-label="Close">✕</button>
        <div class="player"><div><strong>Loading official trailer...</strong></div></div>
      `;
    }
    open_();

    let ytKey = null;
    try {
      const res = await fetch(`${BASE}/${i.media}/${i.tmdbId}/videos?api_key=${API_KEY}`);
      const data = await res.json();
      const vid = (data.results || []).find(v => v.site === "YouTube" && (v.type === "Trailer" || v.type === "Teaser")) || (data.results || []).find(v => v.site === "YouTube");
      if (vid) ytKey = vid.key;
    } catch (e) {}

    if (sheetEl) {
      sheetEl.innerHTML = `
        <button class="x" data-close aria-label="Close">✕</button>
        <div class="player" style="padding:0;overflow:hidden">
          ${ytKey
            ? `<iframe width="100%" height="100%" style="border:0;aspect-ratio:16/9" src="https://www.youtube.com/embed/${ytKey}?autoplay=1" title="${i.title} Trailer" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`
            : `<div style="padding:24px"><strong>${i.title}${i.eps > 1 ? " – Episode " + ep : ""}</strong>Official YouTube trailer is unavailable for this title.</div>`
          }
        </div>
        <div class="pc">
          <span>${i.title}${i.eps > 1 ? " · Ep " + ep + " of " + i.eps : ""}</span>
          ${ep > 1 ? `<button class="btn s" data-watch="${id}" data-ep="${ep - 1}">‹ Prev</button>` : ""}
          ${ep < i.eps ? `<button class="btn p" data-watch="${id}" data-ep="${ep + 1}">Next ›</button>` : ""}
          <button class="btn s" data-id="${id}">Details</button>
        </div>
      `;
    }
  }

  function open_() {
    const modal = $("#modal");
    if (modal) modal.classList.add("open");
    document.body.style.overflow = "hidden";
    if (modal) modal.scrollTop = 0;
  }
  function close_() {
    const modal = $("#modal");
    if (modal) modal.classList.remove("open");
    document.body.style.overflow = "";
    const sheet = $("#sheet");
    if (sheet) sheet.innerHTML = "";
  }

  document.addEventListener("click", e => {
    const t = e.target.closest("button,a");
    if (e.target.id === "modal") { close_(); return; }
    if (!t) return;
    const d = t.dataset;
    if (t.id === "logo") { e.preventDefault(); nav = "Home"; country = "All"; term = ""; const q = $("#q"); if(q) q.value = ""; shown = 12; render(); }
    else if (d.n) { nav = d.n; shown = 12; render(); const n = $("#nav"); if(n) n.classList.remove("open"); }
    else if (d.c) { country = d.c; shown = 12; render(); }
    else if (d.watch !== undefined) { watch(+d.watch, +(d.ep || 1)); }
    else if (d.id !== undefined) { detail(+d.id); }
    else if (d.save !== undefined) {
      const item = items[+d.save];
      if (!item) return;
      const tid = item.tmdbId;
      saved = saved.includes(tid) ? saved.filter(x => x !== tid) : [...saved, tid];
      try { localStorage.setItem("nr-saved", JSON.stringify(saved)); } catch (_) {}
      toast(saved.includes(tid) ? "Added to your list" : "Removed from your list");
      detail(+d.save);
      render();
    }
    else if (d.close !== undefined) close_();
    else if (d.d) { go(slide + +d.d); auto(); }
    else if (d.k) { go(+d.k); auto(); }
    else if (t.id === "more") { shown += 8; render(); }
    else if (t.id === "burger") { const n = $("#nav"); if(n) n.classList.toggle("open"); }
  });

  const qInput = $("#q");
  if (qInput) qInput.addEventListener("input", e => { term = e.target.value.trim(); shown = 12; render(); });

  const sortSelect = $("#sort");
  if (sortSelect) sortSelect.addEventListener("change", e => { sort = e.target.value; render(); });

  document.addEventListener("keydown", e => { if (e.key === "Escape") close_(); });

  loadTMDB();
});
</script>
</body>
</html>
